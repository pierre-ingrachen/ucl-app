name: Bilan quotidien des paris

on:
  schedule:
    # 6h17 UTC = 8h17 a Paris en ete, 7h17 en hiver (minute impaire pour eviter la file d'attente des cron ronds)
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bilan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Recuperer les cotes (uniquement le lundi, ou relance ciblee)
        env:
          SPORTSDB_API_KEY: ${{ secrets.SPORTSDB_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python bilan_paris.py cotes | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Choisir les paris du jour
        env:
          SPORTSDB_API_KEY: ${{ secrets.SPORTSDB_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python bilan_paris.py paris | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Committer le bilan mis a jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache_paris.json cache_cotes_winamax.json cache_teams.json
          git diff --cached --quiet || git commit -m "Bilan paris automatique $(date -u +%Y-%m-%d)"
          git push
