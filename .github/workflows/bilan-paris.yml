name: Bilan quotidien des paris

on:
  # Declenchement unique : planificateur externe (cron-job.org) via l'API
  # workflow_dispatch -> execution immediate, sans file d'attente GitHub.
  # (Pas de cron natif GitHub : il doublerait les appels a TheSportsDB et a The Odds API.)
  workflow_dispatch:
    inputs:
      source:
        description: "Origine du declenchement (trace)"
        required: false
        default: "manuel"

permissions:
  contents: write

# Une seule execution a la fois : evite toute course sur le git push.
concurrency:
  group: bilan-paris
  cancel-in-progress: false

jobs:
  bilan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Tracer l'origine du declenchement
        run: echo "Declenche par - event=${{ github.event_name }} source=${{ inputs.source || 'schedule' }}"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances (avec reessais reseau)
        run: |
          install() {
            pip install -r requirements.txt \
              && pip install torch --index-url https://download.pytorch.org/whl/cpu \
              && pip install numpy scipy
          }
          for tentative in 1 2 3; do
            install && exit 0
            echo "Echec pip (tentative $tentative), nouvelle tentative dans 15 s..."
            sleep 15
          done
          install

      - name: Recuperer les cotes (mardi et vendredi, ou relance ciblee)
        env:
          SPORTSDB_API_KEY: ${{ secrets.SPORTSDB_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          for tentative in 1 2 3; do
            python paris_reseau.py cotes | tee -a "$GITHUB_STEP_SUMMARY" && exit 0
            echo "Echec etape cotes (tentative $tentative), nouvelle tentative dans 30 s..."
            sleep 30
          done
          python paris_reseau.py cotes | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Choisir les paris du jour (reseau de neurones + loi de Poisson)
        env:
          SPORTSDB_API_KEY: ${{ secrets.SPORTSDB_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          for tentative in 1 2 3; do
            python paris_reseau.py paris | tee -a "$GITHUB_STEP_SUMMARY" && exit 0
            echo "Echec etape paris (tentative $tentative), nouvelle tentative dans 30 s..."
            sleep 30
          done
          python paris_reseau.py paris | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Committer le journal mis a jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache_paris_reseau.json cache_cotes_winamax.json
          if git diff --cached --quiet; then
            echo "Aucune modification a committer." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Bilan paris automatique $(date -u +%Y-%m-%d)"
          for tentative in 1 2 3; do
            git pull --rebase --autostash origin master && git push origin HEAD:master && exit 0
            echo "Echec push (tentative $tentative), nouvelle tentative dans 10 s..."
            sleep 10
          done
          exit 1
